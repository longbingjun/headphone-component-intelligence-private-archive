name: Build portfolio demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.txt
      - run: python scripts/build_matrix.py
      - run: python scripts/prepare_web_data.py
      - run: npm ci
        working-directory: web
      - run: npm run build:minio
        working-directory: web
        env:
          PUBLIC_BASE_PATH: /headphone-component-intelligence/
          PUBLIC_SITE_URL: https://longbingjun.github.io
      - name: Upload build for private review
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: site
      - uses: actions/configure-pages@v5
        if: github.event.repository.visibility == 'public'
      - uses: actions/upload-pages-artifact@v3
        if: github.event.repository.visibility == 'public'
        with:
          path: site

  deploy:
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
